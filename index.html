<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div id="app">
      <p>Loading…</p>
      <p id="load-hint" style="display:none; margin-top:1em; font-size:0.875rem; color:var(--color-text-muted,#888);">
        Stuck? Run <code>pnpm dev</code> in the project folder, then open the URL in your browser.
      </p>
    </div>
    <noscript>Enable JavaScript to use the Pomodoro timer.</noscript>
    <script type="module" src="/src/main.js"></script>
    <script>
      setTimeout(function() {
        if (document.getElementById('load-hint') && document.querySelector('.pomodoro-timer') === null) {
          document.getElementById('load-hint').style.display = 'block';
        }
      }, 2000);
    </script>
  </body>
</html>
